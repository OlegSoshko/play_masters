<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Play masters." />
    <title>Play masters</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Manrope:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,450;0,6..72,550;0,6..72,650;1,6..72,450&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        function syncViewportHeight() {
          var viewport = window.visualViewport;
          var height = viewport ? viewport.height : window.innerHeight;
          var offset = viewport ? viewport.offsetTop : 0;
          var root = document.documentElement;
          root.style.setProperty("--app-height", height + "px");
          root.style.setProperty("--app-offset", offset + "px");
        }
        syncViewportHeight();
        window.addEventListener("resize", syncViewportHeight);
        window.addEventListener("orientationchange", syncViewportHeight);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", syncViewportHeight);
          window.visualViewport.addEventListener("scroll", syncViewportHeight);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app">
      <p class="status">Загрузка альбома…</p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
